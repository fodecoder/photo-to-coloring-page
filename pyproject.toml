[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coloring-page"
version = "0.1.0"
description = "Convert photos into printable black-and-white coloring pages using classical computer vision."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "opencv-python>=4.8,<5",
    "numpy>=1.24,<3",
    "Pillow>=10.0,<12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
]
ml = [
    # Placeholder for an optional deep-learning engine. No model weights are
    # bundled with this project. A user who wants to enable a pretrained
    # model must add the relevant inference library here (e.g. `torch`,
    # `transformers`, `diffusers`) themselves, download the weights they
    # choose, and verify that model's license permits their intended use
    # before enabling it. See engines/base.py and the
    # add-conversion-style skill for how to wire a new engine in.
]

[project.scripts]
coloring-page = "coloring_page.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
packages = ["coloring_page"]
mypy_path = "src"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
