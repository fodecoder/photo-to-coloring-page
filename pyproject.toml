[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coloring-page"
version = "0.1.0"
description = "Convert photos into printable black-and-white coloring pages using classical computer vision."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    # opencv-contrib-python is a superset of opencv-python (all the same
    # modules, plus cv2.ximgproc) -- installing it is a drop-in
    # replacement, needed for the "chained" and "skeleton" engines'
    # rollingGuidanceFilter/l0Smooth/createEdgeDrawing/thinning calls.
    "opencv-contrib-python>=4.8,<6",
    "numpy>=1.24,<3",
    "Pillow>=10.0,<12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
]
ml = [
    # Enables the optional `anime2sketch` and `informative_drawings`
    # engines (src/coloring_page/engines/anime2sketch.py,
    # informative_drawings.py). No model weights are bundled with this
    # project -- after installing this extra, you must still separately
    # download pretrained weights for whichever engine you use; see the
    # README's "Extending with an ML engine" section. See engines/base.py
    # and the add-conversion-style skill for how to wire up further new
    # engines.
    "torch>=2.0",
    # Used by scripts/fetch_weights.py to automate downloading Informative
    # Drawings weights from the lllyasviel/Annotators Hugging Face mirror.
    "huggingface_hub>=0.20",
]

[project.scripts]
coloring-page = "coloring_page.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
packages = ["coloring_page"]
mypy_path = "src"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
